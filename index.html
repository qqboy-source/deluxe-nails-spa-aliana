<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deluxe Nails & Spa Aliana</title>
    
    <!-- Preload critical images to prevent flicker and improve LCP -->
    <link rel="preload" as="image" href="images/hero-background.jpg?v=2">
    <link rel="preload" as="image" href="images/site-background.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
      /* Base styles and complex effects not achievable with Tailwind utilities alone */
      html { scroll-behavior: smooth; }
      body {
        /* 
          INSTRUCTION: To set your website background, upload your image to the 
          `public/images` folder and name it 'site-background.jpg'.
          The site will automatically pick it up.
        */
        background-image: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), url('images/site-background.jpg');
        background-size: cover; /* Cover the entire viewport */
        background-position: center center; /* Center the image */
        background-repeat: no-repeat; /* Do not repeat the image */
        background-attachment: fixed; /* Keep the image fixed during scroll */
        background-color: #FBF3E6; /* Light gold fallback color (gold-100) if image fails */
        overflow-x: hidden;
      }
      .fade-in-on-scroll {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 1s ease-out, transform 1s ease-out;
        will-change: opacity, transform;
      }
      .fade-in-on-scroll.is-visible {
        opacity: 1;
        transform: translateY(0);
      }
      
      /* Utility to hide scrollbar but keep it functional */
      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      /* Animation pause utility */
      .pause {
        animation-play-state: paused;
      }
      
      /* Golden Glow Button Effect */
      @keyframes golden-glow {
        0%, 100% { 
          box-shadow: 0 0 4px rgba(217, 172, 100, 0.5), 0 0 8px rgba(217, 172, 100, 0.4);
          border-color: #D9AC64; /* gold-500 */
        }
        50% { 
          box-shadow: 0 0 8px rgba(228, 193, 134, 0.6), 0 0 16px rgba(228, 193, 134, 0.5);
          border-color: #E4C186; /* gold-400 */
        }
      }
      .btn-golden-glow {
        background-color: white;
        color: #78592C; /* gold-800 */
        border: 1px solid #C6934A; /* gold-600 */
        animation: golden-glow 4s ease-in-out infinite;
        transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
      }
      .btn-golden-glow:hover {
        animation-play-state: paused;
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(159, 118, 59, 0.25); /* gold-700 */
      }

      /* Button Fill Animation */
      .btn-fill-gold {
        position: relative;
        overflow: hidden;
        z-index: 1; /* Establishes a stacking context */
        transition: color 0.4s ease-in-out;
      }
      .btn-fill-gold::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #D9AC64; /* gold-500 */
        transform: translateX(-100%);
        transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        z-index: -1; /* Place it behind the content */
      }
      .btn-fill-gold:hover::before {
        transform: translateX(0);
      }
      .btn-fill-gold:hover {
        color: white; /* Change text color to contrast with gold fill */
      }
      /* Modifier for dark buttons to fill with a light color */
      .btn-fill-gold.fill-light::before {
        background-color: #EED6AB; /* gold-300 */
      }
      .btn-fill-gold.fill-light:hover {
        color: #503C1D; /* gold-900 */
      }
    </style>

{

  }
}
</script>
</head>

    <div id="modal-root"></div>
