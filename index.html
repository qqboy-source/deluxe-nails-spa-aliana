<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Deluxe Nails & Spa Aliana</title>

    <link rel="preload" as="image" href="/images/hero-background.jpg">
    <link rel="preload" as="image" href="/images/site-background.jpg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
      html { scroll-behavior: smooth; }
      body {
        background-image: linear-gradient(rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0.85)), url('/images/site-background.jpg');
        background-size: cover;
        background-position: center center;
        background-repeat: no-repeat;
        background-attachment: fixed;
        background-color: #FBF3E6;
        overflow-x: hidden;
      }
      .fade-in-on-scroll {
        opacity: 0;
        transform: translateY(30px);
        transition: opacity 1s ease-out, transform 1s ease-out;
        will-change: opacity, transform;
      }
      .fade-in-on-scroll.is-visible {
        opacity: 1;
        transform: translateY(0);
      }

      .hide-scrollbar::-webkit-scrollbar { display: none; }
      .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

      .pause {
        animation-play-state: paused;
      }

      @keyframes golden-glow {
        0%, 100% {
          box-shadow: 0 0 4px rgba(217, 172, 100, 0.5), 0 0 8px rgba(217, 172, 100, 0.4);
          border-color: #D9AC64;
        }
        50% {
          box-shadow: 0 0 8px rgba(228, 193, 134, 0.6), 0 0 16px rgba(228, 193, 134, 0.5);
          border-color: #E4C186;
        }
      }
      .btn-golden-glow {
        background-color: white;
        color: #78592C;
        border: 1px solid #C6934A;
        animation: golden-glow 4s ease-in-out infinite;
        transition: transform 0.2s ease-out, box-shadow 0.2s ease-out;
      }
      .btn-golden-glow:hover {
        animation-play-state: paused;
        transform: translateY(-2px);
        box-shadow: 0 6px 12px rgba(159, 118, 59, 0.25);
      }

      .btn-fill-gold {
        position: relative;
        overflow: hidden;
        z-index: 1;
        transition: color 0.4s ease-in-out;
        display: inline-block;
      }
      .btn-fill-gold::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: #D9AC64;
        transform: translateX(-100%);
        transition: transform 0.4s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        z-index: -1;
      }
      .btn-fill-gold:hover::before {
        transform: translateX(0);
      }
      .btn-fill-gold:hover {
        color: white;
      }
      .btn-fill-gold.fill-light::before {
        background-color: #EED6AB;
      }
      .btn-fill-gold.fill-light:hover {
        color: #503C1D;
      }

      .liquid-glass-bg {
        position: relative;
        z-index: 1;
      }
      .liquid-glass-bg::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        filter: url(#liquid-glass-filter);
        z-index: -1;
        border-radius: inherit;
        transform: translateZ(0);
      }

      .text-shadow-subtle { text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
      .text-shadow-strong { text-shadow: 2px 2px 8px rgba(0,0,0,0.5); }
      .will-change-transform { will-change: transform; }

      #page-loader {
        position: fixed;
        inset: 0;
        background-color: #FBF3E6;
        z-index: 99999;
        transition: opacity 0.4s ease;
      }
      #page-loader.fade-out {
        opacity: 0;
        pointer-events: none;
      }

    </style>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              'serif': ['Cormorant Garamond', 'serif'],
              'sans': ['Poppins', 'sans-serif'],
            },
            colors: {
              'gold': {
                '100': '#FBF3E6', '200': '#F6E5C9', '300': '#EED6AB',
                '400': '#E4C186', '500': '#D9AC64', '600': '#C6934A',
                '700': '#9F763B', '800': '#78592C', '900': '#503C1D',
              },
            },
            animation: {
              'fade-in-up': 'fadeInUp 1s ease-out forwards',
              'fade-in': 'fadeIn 0.3s ease-out forwards',
              'scale-in': 'scaleIn 0.3s ease-out forwards',
              'scroll-up': 'scroll-up 25s linear infinite',
              'scroll-down': 'scroll-down 25s linear infinite',
            },
            keyframes: {
              fadeInUp: {
                '0%': { opacity: '0', transform: 'translateY(40px)' },
                '100%': { opacity: '1', transform: 'translateY(0)' },
              },
              fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
              scaleIn: {
                '0%': { opacity: '0', transform: 'scale(0.95)' },
                '100%': { opacity: '1', transform: 'scale(1)' },
              },
              'scroll-up': {
                'from': { transform: 'translateY(0)' },
                'to': { transform: 'translateY(-50%)' },
              },
              'scroll-down': {
                'from': { transform: 'translateY(-50%)' },
                'to': { transform: 'translateY(0)' },
              }
            },
          },
        },
      }
    </script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom": "https://esm.sh/react-dom@^19.2.3"
  }
}
</script>
</head>
  <body>
    <svg style="display: none">
      <filter id="liquid-glass-filter">
        <feTurbulence type="fractalNoise" baseFrequency="0.015 0.025" numOctaves="2" seed="2" result="noise">
          <animate attributeName="baseFrequency" dur="30s" values="0.015 0.025;0.02 0.03;0.015 0.025" repeatCount="indefinite"></animate>
        </feTurbulence>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="50" xChannelSelector="R" yChannelSelector="G" />
      </filter>
    </svg>
    <div id="page-loader"></div>
    <div id="root"></div>
    <div id="modal-root"></div>
    <script type="text/babel">
      const { useState, useRef, useEffect, useCallback, useLayoutEffect, Children, cloneElement, isValidElement } = React;

      const InstagramIcon = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <rect width="20" height="20" x="2" y="2" rx="5" ry="5"></rect>
              <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
              <line x1="17.5" x2="17.51" y1="6.5" y2="6.5"></line>
          </svg>
      );
      const TikTokIcon = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <path d="M12.52.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.5.05.52.1 1.03.16 1.54-.9.08-1.79-.19-2.62-.75-.83-.56-1.5-1.3-1.94-2.22a9.12 9.12 0 0 1-.53-3.61c-.32.02-.64.04-.97.05v6.7c0 1.25.09 2.5.24 3.74.52 4.06-2.13 7.6-6.23 8.32-4.1.72-8.03-1.63-8.8-5.69-.76-4.07 1.49-7.79 5.56-8.54.12-.02.24-.04.36-.05v6.69c-1.81.37-3.14 1.99-2.95 3.92.19 1.92 1.82 3.42 3.73 3.42 1.96 0 3.59-1.57 3.59-3.53V.02z"></path>
          </svg>
      );
      const LocationPinIcon = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"></path>
              <circle cx="12" cy="10" r="3"></circle>
          </svg>
      );
      const PhoneIcon = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
          </svg>
      );
      const ClockIcon = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
      );
      const LeftArrowIcon = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
            <path d="M15 18l-6-6 6-6"/>
          </svg>
      );
      const RightArrowIcon = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <path d="M9 18l6-6-6-6"/>
          </svg>
      );
      const ArrowDownIcon = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <path d="m6 9 6 6 6-6"/>
          </svg>
      );
      const ArrowUpIcon = ({ className }) => (
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>
              <path d="m18 15-6-6-6 6"/>
          </svg>
      );

      const MediaCarousel = ({ items }) => {
          const [currentIndex, setCurrentIndex] = useState(0);
          const [isTransitioning, setIsTransitioning] = useState(false);
          const [isInitiallyVisible, setIsInitiallyVisible] = useState(true);
          const [isHovered, setIsHovered] = useState(false);
          const videoRefs = useRef([]);
          const carouselRef = useRef(null);
          const touchStartX = useRef(0);
          const touchEndX = useRef(0);
          useEffect(() => {
              const timer = setTimeout(() => {
                  setIsInitiallyVisible(false);
              }, 7000);
              return () => clearTimeout(timer);
          }, []);
          const goToNext = useCallback(() => {
              if (isTransitioning || items.length <= 1) return;
              setIsTransitioning(true);
              setCurrentIndex((prevIndex) => (prevIndex + 1) % items.length);
          }, [isTransitioning, items.length]);
          useEffect(() => {
              if (isHovered) return;
              const currentItem = items[currentIndex];
              let timerId;
              if (currentItem.type === 'image') {
                  timerId = window.setTimeout(goToNext, 5000);
              }
              return () => {
                  if (timerId) clearTimeout(timerId);
              };
          }, [currentIndex, isHovered, items, goToNext]);
          useEffect(() => {
              videoRefs.current.forEach((video, index) => {
                  if (video) {
                      if (index === currentIndex) {
                          video.currentTime = 0;
                          video.play().catch(error => console.log("Autoplay was prevented:", error));
                      } else {
                          video.pause();
                      }
                  }
              });
          }, [currentIndex]);
          const goToPrevious = () => {
              if (isTransitioning || items.length <= 1) return;
              setIsTransitioning(true);
              setCurrentIndex((prevIndex) => (prevIndex - 1 + items.length) % items.length);
          };
          const goToSlide = (index) => {
              if (isTransitioning) return;
              setIsTransitioning(true);
              setCurrentIndex(index);
          };
          const handleTouchStart = (e) => { touchStartX.current = e.targetTouches[0].clientX; };
          const handleTouchMove = (e) => { touchEndX.current = e.targetTouches[0].clientX; };
          const handleTouchEnd = () => {
              if (touchStartX.current - touchEndX.current > 75) goToNext();
              else if (touchStartX.current - touchEndX.current < -75) goToPrevious();
              touchStartX.current = 0;
              touchEndX.current = 0;
          };
          return (
              <div
                  ref={carouselRef}
                  className="relative w-full h-full overflow-hidden rounded-lg group"
                  onTouchStart={handleTouchStart}
                  onTouchMove={handleTouchMove}
                  onTouchEnd={handleTouchEnd}
                  onMouseEnter={() => setIsHovered(true)}
                  onMouseLeave={() => setIsHovered(false)}
              >
                  <div
                      className="flex w-full h-full transition-transform duration-500 ease-in-out"
                      style={{ transform: `translateX(-${currentIndex * 100}%)` }}
                      onTransitionEnd={() => setIsTransitioning(false)}
                  >
                      {items.map((item, index) => (
                          <div key={index} className="flex-shrink-0 w-full h-full relative bg-black">
                              {item.type === 'image' ? (
                                  <img
                                      src={item.src}
                                      alt={item.alt}
                                      className="w-full h-full object-cover"
                                      loading={index === 0 ? 'eager' : 'lazy'}
                                      onError={(e) => {
                                          e.currentTarget.onerror = null;
                                          e.currentTarget.src = `https://placehold.co/600x400/9F763B/FBF3E6?text=Image+Not+Found`;
                                      }}
                                  />
                              ) : (
                                  <video
                                      ref={el => { videoRefs.current[index] = el; }}
                                      src={item.src}
                                      className="w-full h-full object-cover"
                                      muted
                                      playsInline
                                      preload="auto"
                                      onEnded={goToNext}
                                      onError={(e) => {
                                          const videoElement = e.currentTarget;
                                          const parent = videoElement.parentElement;
                                          if(parent) {
                                              const placeholder = document.createElement('div');
                                              placeholder.className = "w-full h-full flex items-center justify-center bg-gray-800 text-white";
                                              placeholder.innerHTML = `<span>Video Not Found</span>`;
                                              parent.replaceChild(placeholder, videoElement);
                                          }
                                      }}
                                  >
                                      Your browser does not support the video tag.
                                  </video>
                              )}
                          </div>
                      ))}
                  </div>
                  <button
                      onClick={goToPrevious}
                      className={`absolute left-2 top-1/2 -translate-y-1/2 z-10 bg-black/40 text-white p-2 rounded-full group-hover:opacity-100 transition-opacity duration-500 hover:bg-black/60 focus:outline-none focus:ring-2 focus:ring-gold-400 ${isInitiallyVisible ? 'opacity-100' : 'opacity-0'}`}
                      aria-label="Previous slide"
                  >
                      <LeftArrowIcon className="w-6 h-6" />
                  </button>
                  <button
                      onClick={goToNext}
                      className={`absolute right-2 top-1/2 -translate-y-1/2 z-10 bg-black/40 text-white p-2 rounded-full group-hover:opacity-100 transition-opacity duration-500 hover:bg-black/60 focus:outline-none focus:ring-2 focus:ring-gold-400 ${isInitiallyVisible ? 'opacity-100' : 'opacity-0'}`}
                      aria-label="Next slide"
                  >
                      <RightArrowIcon className="w-6 h-6" />
                  </button>
                  <div className="absolute bottom-4 left-1/2 -translate-x-1/2 z-10 flex space-x-2">
                      {items.map((_, index) => (
                          <button
                              key={index}
                              onClick={() => goToSlide(index)}
                              className={`w-3 h-3 rounded-full transition-colors duration-300 ${
                                  currentIndex === index ? 'bg-white' : 'bg-white/50 hover:bg-white/75'
                              }`}
                              aria-label={`Go to slide ${index + 1}`}
                          />
                      ))}
                  </div>
              </div>
          );
      };

      const FadeInSection = ({ children, variant = 'vertical' }) => {
          const [isVisible, setVisible] = useState(false);
          const domRef = useRef(null);
          useEffect(() => {
              const observerOptions = {
                  threshold: 0.1,
                  rootMargin: variant === 'horizontal' ? '0px -25% 0px -25%' : '0px 0px -10% 0px'
              };
              const observer = new IntersectionObserver(entries => {
                  entries.forEach(entry => { setVisible(entry.isIntersecting); });
              }, observerOptions);
              const currentRef = domRef.current;
              if (currentRef) observer.observe(currentRef);
              return () => { if (currentRef) observer.unobserve(currentRef); };
          }, [variant]);
          return (
              <div ref={domRef} className={`fade-in-on-scroll ${isVisible ? 'is-visible' : ''}`}>
                  {children}
              </div>
          );
      };

      const HorizontalScrollSection = ({ children, id, isActive }) => (
          <section
              id={id}
              className="horizontal-scroll-section-item w-screen h-screen flex-shrink-0 flex justify-center items-center p-4 sm:p-6 lg:p-8"
              aria-hidden={!isActive}
          >
              <div className="w-full h-full max-w-7xl mx-auto flex flex-col rounded-xl">
                  <div className={`w-full flex-grow pt-24 pb-12 px-2 md:px-4 hide-scrollbar overflow-y-auto overscroll-y-contain ${!isActive ? 'pointer-events-none' : ''}`}>
                     {children}
                  </div>
              </div>
          </section>
      );

      const HorizontalScrollContainer = ({ children }) => {
          const scrollContainerRef = useRef(null);
          const stickyContentRef = useRef(null);
          const [activeIndex, setActiveIndex] = useState(0);
          const numSections = Children.count(children);
          const dimensionsRef = useRef({ containerTop: 0, sectionWidth: 0, maxTranslateX: 0 });
          useLayoutEffect(() => {
              const scrollContainer = scrollContainerRef.current;
              const stickyContent = stickyContentRef.current;
              if (!scrollContainer || !stickyContent || numSections === 0) return;
              let animationFrameId = null;
              const calculateAndSetDimensions = () => {
                  if (!scrollContainer) return;
                  const rect = scrollContainer.getBoundingClientRect();
                  const firstSection = scrollContainer.querySelector('.horizontal-scroll-section-item');
                  const sectionWidth = firstSection ? firstSection.getBoundingClientRect().width : window.innerWidth;
                  dimensionsRef.current.containerTop = rect.top + window.scrollY;
                  dimensionsRef.current.sectionWidth = sectionWidth;
                  dimensionsRef.current.maxTranslateX = (numSections - 1) * sectionWidth;
                  const containerHeight = dimensionsRef.current.maxTranslateX + window.innerHeight;
                  requestAnimationFrame(() => {
                      const currentHeight = parseFloat(scrollContainer.style.height) || 0;
                      if (Math.abs(currentHeight - containerHeight) > 1) scrollContainer.style.height = `${containerHeight}px`;
                  });
                  updateTransform();
              };
              const updateTransform = () => {
                  if (!stickyContent) return;
                  const { containerTop, maxTranslateX, sectionWidth } = dimensionsRef.current;
                  const scrollTop = window.scrollY;
                  let distance = Math.max(0, scrollTop - containerTop);
                  distance = Math.min(distance, maxTranslateX);
                  stickyContent.style.transform = `translateX(-${Math.round(distance)}px)`;
                  const newActiveIndex = sectionWidth > 0 ? Math.min(numSections - 1, Math.round(distance / sectionWidth)) : 0;
                  setActiveIndex(prevIndex => prevIndex !== newActiveIndex ? newActiveIndex : prevIndex);
              };
              const handleScroll = () => {
                  if (animationFrameId) cancelAnimationFrame(animationFrameId);
                  animationFrameId = requestAnimationFrame(updateTransform);
              };
              window.addEventListener('layoutUpdated', calculateAndSetDimensions);
              const resizeObserver = new ResizeObserver(calculateAndSetDimensions);
              resizeObserver.observe(document.body);
              window.addEventListener('scroll', handleScroll, { passive: true });
              calculateAndSetDimensions();
              return () => {
                  resizeObserver.disconnect();
                  window.removeEventListener('scroll', handleScroll);
                  window.removeEventListener('layoutUpdated', calculateAndSetDimensions);
                  if (animationFrameId) cancelAnimationFrame(animationFrameId);
              };
          }, [numSections]);
          return (
              <div ref={scrollContainerRef} data-testid="horizontal-scroll-container">
                  <div className="sticky top-0 h-screen overflow-hidden">
                      <div ref={stickyContentRef} className="flex flex-nowrap h-full will-change-transform">
                          {Children.map(children, (child, index) => {
                              if (isValidElement(child)) return cloneElement(child, { isActive: index === activeIndex });
                              return child;
                          })}
                      </div>
                  </div>
              </div>
          );
      };

      const Hero = () => {
          const heroRef = useRef(null);
          const [opacity, setOpacity] = useState(1);
          useLayoutEffect(() => {
              const setHeroHeight = () => {
                  if (heroRef.current) {
                      heroRef.current.style.height = `${window.innerHeight - 80}px`;
                      window.dispatchEvent(new CustomEvent('layoutUpdated'));
                  }
              };
              const timeoutId = setTimeout(setHeroHeight, 150);
              window.addEventListener('resize', setHeroHeight);
              return () => { window.removeEventListener('resize', setHeroHeight); clearTimeout(timeoutId); };
          }, []);
          useEffect(() => {
              const handleScroll = () => {
                  setOpacity(Math.max(0, 1 - window.scrollY / 400));
              };
              window.addEventListener('scroll', handleScroll, { passive: true });
              return () => window.removeEventListener('scroll', handleScroll);
          }, []);
          return (
              <section ref={heroRef} id="home" className="relative min-h-[500px] flex items-center justify-center text-center text-white">
                  <div className="absolute top-0 left-0 w-full h-full bg-cover bg-center" style={{ backgroundImage: "url('/images/hero-background.jpg')" }}></div>
                  <div className="absolute top-0 left-0 w-full h-full bg-gold-900/40"></div>
                  <div
                      className="relative z-10 p-8 max-w-3xl bg-black/20 rounded-2xl border border-white/20 shadow-xl liquid-glass-bg"
                      style={{ opacity: opacity, transition: 'opacity 0.1s linear', willChange: 'opacity' }}
                  >
                      <h1 className="text-5xl md:text-7xl font-serif font-bold text-white tracking-wider leading-tight text-shadow-strong">
                          Elegance at Your Fingertips
                      </h1>
                      <p className="mt-4 text-lg md:text-xl font-sans font-light text-gold-100 max-w-xl mx-auto text-shadow-strong">
                          Experience tranquility and bespoke nail artistry at Deluxe Nails & Spa Aliana.
                      </p>
                      <div className="mt-8">
                          <a href="tel:2817620878" className="font-bold py-3 px-8 rounded-lg text-lg btn-golden-glow btn-fill-gold">
                              Book Your Escape
                          </a>
                      </div>
                  </div>
              </section>
          );
      };

      const Header = () => {
          const [isOpen, setIsOpen] = useState(false);
          const navLinks = [
              { name: 'Home', href: '#home' },
              { name: 'About', href: '#about' },

                                  <div className="w-20 h-20 mx-auto flex items-center justify-center rounded-full bg-gold-900/40 border border-gold-500/50 transition-all duration-300 group-hover:bg-gold-800/60 group-hover:border-gold-400/80 group-hover:scale-105 flex-shrink-0">
                                      <Icon className="w-10 h-10 text-gold-400 transition-colors duration-300 group-hover:text-gold-300" />
                                  </div>
                                  <h3 className="mt-4 text-xl font-serif font-semibold text-white">{title}</h3>
                                  <div className="mt-2 text-gray-200 font-sans flex-grow flex items-center justify-center">{content}</div>
                                  {link && linkText && (
                                      <a href={link} target="_blank" rel="noopener noreferrer" className="mt-3 inline-block text-gold-400 font-semibold hover:text-gold-300 transition-colors">{linkText}</a>
                                  )}
                              </div>
                          ))}
                      </div>
                      <div className="mt-16 rounded-lg overflow-hidden shadow-xl h-96 border border-white/20">
                          <iframe
                              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3467.4361545620846!2d-95.69899432367462!3d29.64964913702047!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8640e10e4a13348b%3A0x6e26b1758c0c0048!2sDeluxe%20Nails%20%26%20Spa%20Aliana!5e0!3m2!1sen!2sus!4v1718826742511!5m2!1sen!2sus"
                              width="100%" height="100%" style={{ border: 0 }} allowFullScreen={true} loading="lazy"
                              referrerPolicy="no-referrer-when-downgrade" title="Google Maps Location of Deluxe Nails & Spa Aliana">
                          </iframe>
                      </div>
                  </div>
              </section>
          );
      };

      const Footer = () => (
          <footer className="bg-black/20 text-white border-t border-white/20 liquid-glass-bg">
              <div className="max-w-7xl mx-auto py-12 px-4 sm:px-6 lg:px-8">
                  <div className="grid grid-cols-1 md:grid-cols-3 gap-8 text-center md:text-left">
                      <div>
                          <h3 className="text-2xl font-serif font-bold text-gold-300">Deluxe Nails & Spa Aliana</h3>
                          <p className="mt-2 text-white/90 font-sans text-sm">10335 West Grand Pkwy S STE 120<br/>Richmond, TX 77407</p>
                      </div>
                      <div className="md:text-center">
                          <h3 className="text-xl font-serif font-semibold text-gold-300">Amenities & Information</h3>
                          <p className="mt-4 text-white/90 font-sans text-sm uppercase">Complimentary refreshments & cocktails are provided</p>
                          <p className="mt-3 text-white/80 font-sans text-xs tracking-wider uppercase">RSVP  |  WALK-IN WELCOME  |  GIFT CARDS AVAILABLE  |  EVENT HOSTING</p>
                      </div>
                      <div className="md:text-right">
                          <h3 className="text-xl font-serif font-semibold text-gold-300">Follow Us</h3>
                          <div className="mt-4 flex justify-center md:justify-end space-x-6">
                              <a href="https://www.instagram.com/deluxenails_alianatx/" target="_blank" rel="noopener noreferrer" className="text-white hover:text-gold-300 transition-colors transform hover:scale-110">
                                  <span className="sr-only">Instagram</span><InstagramIcon className="w-7 h-7" />
                              </a>
                              <a href="https://www.tiktok.com/@deluxenailsspaaliana?" target="_blank" rel="noopener noreferrer" className="text-white hover:text-gold-300 transition-colors transform hover:scale-110">
                                  <span className="sr-only">TikTok</span><TikTokIcon className="w-7 h-7" />
                              </a>
                          </div>
                      </div>
                  </div>
                  <div className="mt-8 border-t border-gray-700 pt-8 text-center text-white/70 text-sm font-sans">
                      <p>© {new Date().getFullYear()} Deluxe Nails & Spa Aliana. All Rights Reserved.</p>
                  </div>
              </div>
          </footer>
      );

      function App() {
          useEffect(() => {
              const loader = document.getElementById('page-loader');
              if (loader) {
                  loader.classList.add('fade-out');
                  setTimeout(() => loader.remove(), 400);
              }
          }, []);
          return (
              <div className="font-sans text-gray-800">
                  <Header />
                  <main>
                      <Hero />
                      <HorizontalScrollContainer>
                          <HorizontalScrollSection id="about">
                              <FadeInSection variant="horizontal"><About /></FadeInSection>
                          </HorizontalScrollSection>
                          <HorizontalScrollSection id="vision">
                              <FadeInSection variant="horizontal"><OurVision /></FadeInSection>
                          </HorizontalScrollSection>
                          <HorizontalScrollSection id="services">
                              <FadeInSection variant="horizontal"><Services /></FadeInSection>
                          </HorizontalScrollSection>
                          <HorizontalScrollSection id="gallery">
                              <FadeInSection variant="horizontal"><Gallery /></FadeInSection>
                          </HorizontalScrollSection>
                      </HorizontalScrollContainer>
                      <FadeInSection><Contact /></FadeInSection>
                  </main>
                  <Footer />
              </div>
          );
      }

      const rootElement = document.getElementById('root');
      if (!rootElement) throw new Error("Could not find root element to mount to");
      const root = ReactDOM.createRoot(rootElement);
      root.render(<React.StrictMode><App /></React.StrictMode>);
    </script>
  </body>
</html>
